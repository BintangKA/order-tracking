services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: order-tracking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_tracking
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uorder_user",
          "-porder_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Golang Backend Service (go version: go1.27.1 amd64)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.27.1"
    image: order-tracking-backend:go1.27.1
    container_name: order-tracking-backend
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "order_user"
      DB_PASSWORD: "order_password"
      DB_NAME: "order_tracking"
      GIN_MODE: "release"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # React Frontend Service (node version: v24.14.1 | react: 19.2.8)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24.14.1"
    image: order-tracking-frontend:node24.14.1
    container_name: order-tracking-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8080/api"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: